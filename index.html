<body>
<header><h1>David's Strength Coach</h1><small>Strength, Myzone and Wellness Passport</small></header>
<nav id="nav"></nav>
<main>
<section id="home" class="page active"></section><section id="train" class="page"></section><section id="guides" class="page"></section><section id="progressPage" class="page"></section>
<section id="myzone" class="page"></section><section id="wellness" class="page"></section><section id="lifestyle" class="page"></section><section id="photos" class="page"></section><section id="reports" class="page"></section><section id="chatgptExport" class="page"></section><section id="settings" class="page"></section>
</main>
<script>
const DATA={"routines": {"Upper A": [{"name": "Bench Press", "sets": 5, "reps": 5, "start": 40, "goal": 75, "inc": 2.5, "rest": 180, "type": "barbell"}, {"name": "Assisted Pull-ups", "sets": 5, "reps": 5, "start": 25, "goal": 0, "inc": -2.5, "rest": 150, "type": "machine"}, {"name": "Standing Overhead Press", "sets": 4, "reps": 5, "start": 25, "goal": 47.5, "inc": 2.5, "rest": 150, "type": "barbell"}, {"name": "Barbell Row", "sets": 4, "reps": 6, "start": 40, "goal": 75, "inc": 2.5, "rest": 120, "type": "barbell"}, {"name": "Incline Dumbbell Press", "sets": 3, "reps": 8, "start": 15, "goal": 27.5, "inc": 2.5, "rest": 90, "type": "dumbbell"}, {"name": "Face Pull", "sets": 3, "reps": 15, "start": 20, "goal": 35, "inc": 2.5, "rest": 75, "type": "machine"}, {"name": "Farmer's Carry", "sets": 3, "reps": "40 m", "start": 30, "goal": 45, "inc": 2.5, "rest": 90, "type": "dumbbell"}], "Legs & Core": [{"name": "Back Squat", "sets": 5, "reps": 5, "start": 50, "goal": 110, "inc": 5, "rest": 210, "type": "barbell"}, {"name": "Romanian Deadlift", "sets": 4, "reps": 8, "start": 50, "goal": 110, "inc": 5, "rest": 180, "type": "barbell"}, {"name": "Bulgarian Split Squat", "sets": 3, "reps": "8/leg", "start": 10, "goal": 20, "inc": 2.5, "rest": 90, "type": "dumbbell"}, {"name": "Leg Press", "sets": 3, "reps": 10, "start": 120, "goal": 200, "inc": 5, "rest": 120, "type": "machine"}, {"name": "Hamstring Curl", "sets": 3, "reps": 12, "start": 30, "goal": 50, "inc": 2.5, "rest": 75, "type": "machine"}, {"name": "Ab Wheel", "sets": 3, "reps": 10, "start": 0, "goal": 15, "inc": 0, "rest": 60, "type": "bodyweight"}, {"name": "Cable Crunch", "sets": 3, "reps": 15, "start": 30, "goal": 50, "inc": 2.5, "rest": 60, "type": "machine"}], "Upper B": [{"name": "Incline Barbell Bench", "sets": 4, "reps": 6, "start": 35, "goal": 65, "inc": 2.5, "rest": 150, "type": "barbell"}, {"name": "Assisted Pull-ups", "sets": 4, "reps": 8, "start": 25, "goal": 0, "inc": -2.5, "rest": 150, "type": "machine"}, {"name": "Seated Dumbbell Press", "sets": 3, "reps": 8, "start": 12.5, "goal": 22.5, "inc": 2.5, "rest": 120, "type": "dumbbell"}, {"name": "Chest-Supported Row", "sets": 4, "reps": 8, "start": 40, "goal": 70, "inc": 2.5, "rest": 120, "type": "machine"}, {"name": "Cable Fly", "sets": 3, "reps": 12, "start": 10, "goal": 20, "inc": 2.5, "rest": 75, "type": "machine"}, {"name": "Lat Pulldown", "sets": 3, "reps": 10, "start": 45, "goal": 70, "inc": 2.5, "rest": 90, "type": "machine"}, {"name": "Dumbbell Lateral Raise", "sets": 3, "reps": 15, "start": 6, "goal": 12, "inc": 1, "rest": 60, "type": "dumbbell"}, {"name": "Barbell Curl", "sets": 3, "reps": 10, "start": 20, "goal": 35, "inc": 2.5, "rest": 75, "type": "barbell"}, {"name": "Triceps Pushdown", "sets": 3, "reps": 10, "start": 25, "goal": 45, "inc": 2.5, "rest": 75, "type": "machine"}]}, "alternatives": {"Bench Press": ["Machine Chest Press", "Dumbbell Bench Press"], "Back Squat": ["Hack Squat", "Leg Press"], "Romanian Deadlift": ["Seated Leg Curl", "Hip Thrust"], "Standing Overhead Press": ["Seated Dumbbell Press", "Machine Shoulder Press"], "Barbell Row": ["Chest-Supported Row", "Cable Row"], "Assisted Pull-ups": ["Lat Pulldown", "Neutral-Grip Pulldown"]}};
const defaults={profile:{weight:88,spin:3,theme:"light",heightCm:193,proteinGoal:160,calorieGoal:2400,waterGoal:3},history:[],prs:{},next:{},stalls:{},myzone:[],wellness:[],readiness:[],coachFlags:{},nutrition:[],measurements:[],photos:{},photoHistory:[],weeklyGoals:{strength:3,spin:3,proteinDays:7},inProgress:null,schedule:{Mon:"Upper A",Tue:"Spin",Wed:"Legs & Core",Thu:"Spin",Fri:"Rest",Sat:"Upper B",Sun:"Spin"}};
let state=JSON.parse(localStorage.getItem("dsc-v8-dashboard")||JSON.stringify(defaults));for(const k of Object.keys(defaults))if(state[k]===undefined)state[k]=defaults[k];if(!state.profile.proteinGoal)state.profile.proteinGoal=160;if(!state.profile.heightCm)state.profile.heightCm=193;if(!Array.isArray(state.photoHistory))state.photoHistory=[];if(!state.weeklyGoals)state.weeklyGoals={strength:3,spin:3,proteinDays:7};const save=()=>localStorage.setItem("dsc-v8-dashboard",JSON.stringify(state));
const tabs=[["home","Home"],["train","Train"],["guides","Guides"],["progressPage","Progress"],["myzone","Myzone"],["wellness","Wellness"],["lifestyle","Lifestyle"],["photos","Photos"],["reports","Reports"],["chatgptExport","ChatGPT Export"],["settings","Settings"]];
function initNav(){nav.innerHTML=tabs.map((x,i)=>`<button data-page="${x[0]}" class="${i===0?"active":""}">${x[1]}</button>`).join("");nav.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>openPage(b.dataset.page,b)))}
function captureWorkoutDraft(){
 if(!state.inProgress||!document.getElementById("session")||!document.querySelector("#session .workoutTitle"))return;
 const e=DATA.routines[state.inProgress.routine]?.[state.inProgress.index];if(!e)return;
 const sets=[];for(let s=0;;s++){const kg=document.getElementById(`kg-${s}`),rp=document.getElementById(`rp-${s}`);if(!kg||!rp)break;sets.push({kg:kg.value,reps:rp.value,rir:document.getElementById(`rir-${s}`)?.value??"2",done:document.querySelectorAll(".setDone")[s]?.classList.contains("done")||false})}
 state.inProgress.draft={exercise:e.name,sets,form:document.getElementById("formQuality")?.value||"good",pain:document.getElementById("painFlag")?.value||"no",notes:document.getElementById("exerciseNotes")?.value||""};save();
}
function openPage(id,b){captureWorkoutDraft();document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");nav.querySelectorAll("button").forEach(x=>x.classList.remove("active"));b?.classList.add("active");renderAll()}
function latestFor(name){for(const w of state.history){const r=w.results?.find(x=>x.name===name);if(r)return r}return null}
function thisMonth(arr){const n=new Date();return arr.filter(x=>{const d=new Date(x.iso||x.date);return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear()})}
function sum(a,k){return a.reduce((t,x)=>t+(+x[k]||0),0)}
function readinessScore(){return state.readiness[0]?.score||7}
function todayKey(){return new Date().toLocaleDateString()}
function todayNutrition(){return state.nutrition.find(x=>x.date===todayKey())||null}
function strengthSessionsThisWeek(){return withinDays(state.history,7).length}
function spinSessionsThisWeek(){return withinDays(state.myzone,7).filter(x=>String(x.type).toLowerCase()==="spin").length}
function proteinDaysThisWeek(){const goal=+state.profile.proteinGoal||160;return withinDays(state.nutrition,7).filter(x=>(+x.protein||0)>=goal).length}
function nextScheduledSession(){const labels=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],now=new Date();for(let add=0;add<8;add++){const d=new Date(now);d.setDate(now.getDate()+add);d.setHours(9,0,0,0);if(d<=now)continue;const label=labels[d.getDay()],session=state.schedule?.[label];if(session&&session!=="Rest")return{session,date:d}}return null}
function countdownText(){const n=nextScheduledSession();if(!n)return"No session scheduled";const hours=Math.max(0,Math.floor((n.date-Date.now())/3600000)),days=Math.floor(hours/24),rem=hours%24;return `${n.session} in ${days?days+"d ":""}${rem}h (approx. 9am)`}
function latestLiftPrediction(name){const e=Object.values(DATA.routines).flat().find(x=>x.name===name),pts=seriesForExercise(name),current=state.prs[name]??e?.start??0;if(pts.length<2)return`${current} kg now · build more history`;const recent=pts.slice(-4),gain=(recent.at(-1).value-recent[0].value)/Math.max(1,recent.length-1),predicted=Math.max(0,current+gain*6);return`${current} kg now · ~${predicted.toFixed(1)} kg in 12 weeks`}
function wellnessChangeSummary(){const c=state.wellness[0],p=state.wellness[1];if(!c)return"No Wellness assessment entered";if(!p)return"Baseline recorded — add a second assessment to compare";const bits=[];if(c.skeletalMuscleMass&&p.skeletalMuscleMass)bits.push(`muscle ${(c.skeletalMuscleMass-p.skeletalMuscleMass)>=0?"+":""}${(c.skeletalMuscleMass-p.skeletalMuscleMass).toFixed(1)} kg`);if(c.bodyFatMass&&p.bodyFatMass)bits.push(`fat mass ${(c.bodyFatMass-p.bodyFatMass)>=0?"+":""}${(c.bodyFatMass-p.bodyFatMass).toFixed(1)} kg`);if(c.phaseAngle&&p.phaseAngle)bits.push(`phase angle ${(c.phaseAngle-p.phaseAngle)>=0?"+":""}${(c.phaseAngle-p.phaseAngle).toFixed(1)}°`);return bits.join(" · ")||"Two assessments recorded"}
function dashboardInsights(){const insights=[],n=todayNutrition(),goal=+state.profile.proteinGoal||160,advice=overallAdvice();insights.push(`${advice.title}: ${advice.text}`);if(n&&n.protein<goal)insights.push(`${goal-n.protein} g protein remains today.`);if(!n)insights.push(`No nutrition entry today. Protein target is ${goal} g.`);if(recentHardSpin())insights.push("Recent spin load may affect legs; avoid forcing lower-body progression.");if(state.wellness.length>=2)insights.push(`Wellness trend: ${wellnessChangeSummary()}.`);if(state.history.length===0)insights.push("Log your first full workout to unlock personalised lift predictions.");return insights.slice(0,5)}
function proteinQuickAdd(grams){let entry=state.nutrition.find(x=>x.date===todayKey());if(!entry){entry={date:todayKey(),iso:new Date().toISOString(),sleep:0,protein:0,calories:0,water:0,creatine:"No"};state.nutrition.unshift(entry)}entry.protein=(+entry.protein||0)+grams;entry.iso=new Date().toISOString();save();renderAll()}
function openChatGPTFromDashboard(){openPage("chatgptExport",nav.querySelector('[data-page="chatgptExport"]'));setTimeout(async()=>{const text=generateChatGPTReport("weekly","Review my Coach Dashboard and give me exact priorities for this week.");chatgptReportText.value=text;const ok=await copyReportText(text);chatgptCopyStatus.textContent=ok?"Weekly coach report copied — paste it into ChatGPT.":"Report generated. Use Select All and Copy."},0)}

function clampScore(n){return Math.max(0,Math.min(100,Math.round(n)))}
function scoreLabel(score){
 if(score===null||score===undefined)return"Insufficient data";
 if(score>=85)return"Excellent";
 if(score>=70)return"Good";
 if(score>=55)return"Developing";
 return"Needs attention";
}
function scoreDisplay(score){return score===null||score===undefined?"—":String(score)}
function workoutQualityScore(w){
 if(!w?.results?.length)return null;
 const sets=w.results.flatMap(r=>r.sets||[]);
 if(!sets.length)return null;
 const avgRir=sets.reduce((a,s)=>a+(+s.rir||0),0)/sets.length;
 const formGood=w.results.filter(r=>["excellent","good"].includes(r.form)).length/w.results.length;
 const painFree=w.results.filter(r=>!r.pain||r.pain==="no").length/w.results.length;
 const completion=w.results.reduce((a,r)=>a+(r.sets||[]).filter(s=>(+s.reps||0)>0).length,0)/sets.length;
 const rirFit=Math.max(0,1-Math.abs(avgRir-1.75)/3);
 return clampScore(completion*35+formGood*30+painFree*20+rirFit*15);
}
function liftImprovementScore(days){
 const rows=withinDays(state.history,days);
 if(!rows.length)return null;
 const names=["Bench Press","Back Squat","Standing Overhead Press","Romanian Deadlift"];
 let measured=0,positive=0;
 for(const name of names){
  const pts=seriesForExercise(name);
  if(pts.length>=2){measured++;const recent=pts.slice(-4);if(recent[recent.length-1].value>recent[0].value)positive++}
 }
 const quality=rows.map(workoutQualityScore).filter(x=>x!==null);
 const q=quality.length?average(quality.map(v=>({v})),"v"):70;
 return clampScore((measured?positive/measured*60:35)+q*.4);
}
function coachingScores(days=7){
 const strengthRows=withinDays(state.history,days),spinRows=withinDays(state.myzone,days).filter(x=>String(x.type).toLowerCase()==="spin");
 const nutritionRows=withinDays(state.nutrition,days),readinessRows=withinDays(state.readiness,days);
 const strengthGoal=Math.max(1,+state.weeklyGoals?.strength||3),spinGoal=Math.max(1,+state.weeklyGoals?.spin||3),proteinGoal=Math.max(1,+state.profile.proteinGoal||160);
 const strengthConsistency=strengthRows.length?Math.min(1,strengthRows.length/strengthGoal):0;
 const spinConsistency=spinRows.length?Math.min(1,spinRows.length/spinGoal):0;
 const loggedProtein=nutritionRows.filter(x=>(+x.protein||0)>0),proteinHit=loggedProtein.filter(x=>(+x.protein||0)>=proteinGoal).length;
 const proteinRatio=loggedProtein.length?Math.min(1,average(loggedProtein,"protein")/proteinGoal):0;
 const readinessAvg=readinessRows.length?average(readinessRows,"score"):0;
 const sleepRows=nutritionRows.filter(x=>(+x.sleep||0)>0),sleepRatio=sleepRows.length?Math.min(1,average(sleepRows,"sleep")/7.5):0;
 const liftScore=liftImprovementScore(days);
 const latestQuality=workoutQualityScore(state.history[0]);
 const strength=strengthRows.length?clampScore(strengthConsistency*55+(liftScore??65)*.30+(latestQuality??70)*.15):null;
 const recovery=(readinessRows.length||sleepRows.length)?clampScore((readinessRows.length?readinessAvg/10*65:32.5)+(sleepRows.length?sleepRatio*35:17.5)):null;
 const nutrition=loggedProtein.length?clampScore(proteinRatio*70+(proteinHit/Math.max(1,loggedProtein.length))*30):null;
 const consistency=(strengthRows.length||spinRows.length||loggedProtein.length)?clampScore(strengthConsistency*50+spinConsistency*25+(proteinHit/Math.max(1,days))*25):null;
 const muscleBuilding=(strength!==null||nutrition!==null)?clampScore((strength??60)*.55+(nutrition??60)*.35+(recovery??60)*.10):null;
 const entries=[strength,muscleBuilding,recovery,nutrition,consistency].filter(x=>x!==null);
 const overall=entries.length?clampScore(entries.reduce((a,b)=>a+b,0)/entries.length):null;
 const categories=[
  {name:"Strength",score:strength},
  {name:"Muscle building",score:muscleBuilding},
  {name:"Recovery",score:recovery},
  {name:"Nutrition",score:nutrition},
  {name:"Consistency",score:consistency}
 ];
 const sources=[
  strengthRows.length>0,
  spinRows.length>0,
  loggedProtein.length>0,
  readinessRows.length>0,
  state.wellness.length>0,
  state.photoHistory?.length>0
 ];
 const confidence=clampScore(sources.filter(Boolean).length/sources.length*100);
 return{overall,categories,confidence,strengthRows,spinRows,nutritionRows,readinessRows};
}
function bodyCompositionTrendText(){
 const c=state.wellness[0],p=state.wellness[1];
 if(!c)return"No assessment recorded";
 if(!p)return"Baseline recorded; a second assessment is needed";
 const muscle=(+c.skeletalMuscleMass||0)-(+p.skeletalMuscleMass||0),fat=(+c.bodyFatMass||0)-(+p.bodyFatMass||0),phase=(+c.phaseAngle||0)-(+p.phaseAngle||0);
 const bits=[];
 if(c.skeletalMuscleMass&&p.skeletalMuscleMass)bits.push(`skeletal muscle ${muscle>=0?"+":""}${muscle.toFixed(1)} kg`);
 if(c.bodyFatMass&&p.bodyFatMass)bits.push(`body-fat mass ${fat>=0?"+":""}${fat.toFixed(1)} kg`);
 if(c.phaseAngle&&p.phaseAngle)bits.push(`phase angle ${phase>=0?"+":""}${phase.toFixed(1)}°`);
 return bits.join(" · ")||"Assessments recorded, but comparable values are incomplete";
}
function monthlyPersonalRecords(){
 const now=new Date(),monthStart=new Date(now.getFullYear(),now.getMonth(),1).getTime(),current={},before={};
 for(const w of state.history){
  const t=new Date(w.iso||w.date).getTime();
  for(const r of w.results||[]){
   const best=Math.max(...(r.sets||[]).map(s=>+s.kg||0));
   const target=t>=monthStart?current:before;
   target[r.name]=Math.max(target[r.name]||0,best);
  }
 }
 return Object.entries(current).filter(([name,v])=>v>(before[name]||0)).map(([name,v])=>({name,value:v,previous:before[name]||null}));
}
function biggestWinText(days=7){
 const prs=monthlyPersonalRecords();if(prs.length)return`${prs[0].name} reached a new recorded best of ${prs[0].value} kg`;
 const s=coachingScores(days);
 if(s.consistency>=85)return"Training and tracking consistency are strong";
 const n=withinDays(state.nutrition,days),goal=+state.profile.proteinGoal||160,hit=n.filter(x=>(+x.protein||0)>=goal).length;
 if(hit)return`Protein target achieved on ${hit} logged day(s)`;
 if(state.photoHistory?.length)return"A dated physique baseline has been stored";
 return"Your programme, goals and starting weights are established";
}
function mainPriorityText(days=7){
 const s=coachingScores(days);
 if(s.recovery!==null&&s.recovery<60)return"Prioritise sleep, soreness management and lower-fatigue training decisions";
 if(s.nutrition!==null&&s.nutrition<70)return`Raise average protein towards ${state.profile.proteinGoal||160} g/day`;
 if(s.consistency!==null&&s.consistency<70)return"Complete the planned weekly strength sessions consistently";
 if(recentHardSpin())return"Manage lower-body fatigue around hard spin sessions";
 if(!state.history.length)return"Log the first full strength week to unlock meaningful trend coaching";

function renderGuides(){const names=[...new Set(Object.values(DATA.routines).flat().map(x=>x.name))];guides.innerHTML=`<div class="card"><h2>Exercise guides</h2><label>Exercise</label><select id="guideSelect">${names.map(n=>`<option>${n}</option>`).join('')}</select><button id="openGuide" style="margin-top:9px">Open guide</button></div><div id="guideContent"></div>`;openGuide.addEventListener('click',()=>displayGuide(guideSelect.value));displayGuide(names[0])}

function renderProgress(){progressPage.innerHTML=`<div class="card"><h2>Strength analytics</h2><label>Exercise</label><select id="chartExercise">${["Bench Press","Back Squat","Standing Overhead Press","Romanian Deadlift"].map(x=>`<option>${x}</option>`).join("")}</select><canvas id="strengthChart" width="800" height="300"></canvas><div id="strengthStats"></div></div><div class="card"><h2>Body composition trend</h2><select id="bodyMetric"><option value="weight">Weight</option><option value="skeletalMuscleMass">Skeletal muscle mass</option><option value="bodyFatMass">Body fat mass</option><option value="phaseAngle">Phase angle</option></select><canvas id="bodyChart" width="800" height="300"></canvas></div><div class="card"><h2>Myzone MEP trend</h2><canvas id="mepChart" width="800" height="300"></canvas></div>`;chartExercise.addEventListener("change",drawCharts);bodyMetric.addEventListener("change",drawCharts);setTimeout(drawCharts,0)}

wnloadable template.</p><input type="file" id="wellCsv" accept=".csv"><button id="downloadWellTemplate" class="secondary" style="margin-top:9px">Download template</button></div>`;saveWellness.addEventListener("click",()=>{const rec={date:new Date().toLocaleDateString(),iso:new Date().toISOString(),wellnessAge:+wAge.value||"",weight:+wWeight.value||"",bmi:+wBmi.value||"",skeletalMuscleMass:+wSkeletalMuscle.value||"",softLeanMass:+wSoftLean.value||"",fatFreeMass:+wFatFree.value||"",bodyFatMass:+wBodyFatMass.value||"",bodyFat:+wFat.value||"",boneMineralContent:+wBoneMineral.value||"",totalBodyWater:+wTotalWater.value||"",intracellularWater:+wIntracellularWater.value||"",extracellularWater:+wExtracellularWater.value||"",phaseAngle:+wPhaseAngle.value||"",bmr:+wBmr.value||"",strength:+wStrength.value||"",cardio:+wCardio.value||"",balance:+wBalance.value||"",mobility:+wMobility.value||""};state.wellness.unshift(rec);if(rec.weight)state.profile.weight=rec.weight;save();renderAll()});wellCsv.addEventListener("change",importWellnessCsv);downloadWellTemplate.addEventListener("click",()=>downloadText("wellness-body-composition-template.csv","date,wellnessAge,weight,bmi,skeletalMuscleMass,softLeanMass,fatFreeMass,bodyFatMass,bodyFat,boneMineralContent,totalBodyWater,intracellularWater,extracellularWater,phaseAngle,bmr,strength,cardio,balance,mobility\n2026-08-05,45,88,23.5,39,70,72,16,18.2,3.4,48,30,18,6.2,1850,62,71,68,59"))}
function importWellnessCsv(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const lines=r.result.trim().split(/\r?\n/),heads=lines.shift().split(",");for(const line of lines){const v=line.split(","),o={};heads.forEach((h,i)=>o[h.trim()]=v[i]?.trim());o.iso=new Date(o.date).toISOString();["wellnessAge","weight","bmi","skeletalMuscleMass","softLeanMass","fatFreeMass","bodyFatMass","bodyFat","boneMineralContent","totalBodyWater","intracellularWater","extracellularWater","phaseAngle","bmr","strength","cardio","balance","mobility"].forEach(k=>o[k]=+o[k]||0);state.wellness.unshift(o);if(o.weight)state.profile.weight=o.weight}save();renderAll();alert("Wellness and body-composition CSV imported.")};r.readAsText(f)}
function compositionComparison(c,p){const rows=[["Weight",p.weight,c.weight,"kg"],["Skeletal muscle mass",p.skeletalMuscleMass,c.skeletalMuscleMass,"kg"],["Body fat mass",p.bodyFatMass,c.bodyFatMass,"kg"],["Body fat",p.bodyFat,c.bodyFat,"%"],["Fat-free mass",p.fatFreeMass,c.fatFreeMass,"kg"],["Total body water",p.totalBodyWater,c.totalBodyWater,"kg"],["Phase angle",p.phaseAngle,c.phaseAngle,"°"],["BMR",p.bmr,c.bmr,"kcal"]];return `<table><tr><th>Measure</th><th>Previous</th><th>Latest</th><th>Change</th></tr>${rows.map(r=>{const a=+r[1]||0,b=+r[2]||0,d=b-a;return `<tr><td>${r[0]}</td><td>${a||"—"}</td><td>${b||"—"}</td><td>${a&&b?(d>0?"+":"")+d.toFixed(1)+" "+r[3]:"—"}</td></tr>`}).join("")}</table>`}
function renderLifestyle(){const today=state.nutrition.find(x=>x.date===todayKey()),protein=+today?.protein||0,goal=+state.profile.proteinGoal||160,pct=Math.min(100,Math.round(protein/goal*100));lifestyle.innerHTML=`<div class="card"><h2>Daily protein tracker</h2><div style="display:flex;justify-content:space-between"><b>${protein} g / ${goal} g</b><span>${pct}%</span></div><div class="progress"><div style="width:${pct}%"></div></div><p class="muted">${Math.max(0,goal-protein)} g remaining today</p><div class="quickProtein"><button data-add="10">+10 g</button><button data-add="20">+20 g</button><button data-add="30">+30 g</button><input id="customProtein" placeholder="Custom grams" style="max-width:150px"><button id="addCustomProtein" class="good">Add</button></div></div><div class="card"><h2>Recovery and nutrition</h2><div class="grid"><div><label>Sleep hours</label><input id="lifeSleep" value="${today?.sleep||""}"></div><div><label>Sleep quality 1–10</label><input id="lifeSleepQ"></div><div><label>Energy 1–10</label><input id="lifeEnergy"></div><div><label>Stress 1–10</label><input id="lifeStress"></div><div><label>Soreness 1–10</label><input id="lifeSore"></div><div><label>Total protein g</label><input id="lifeProtein" value="${protein||""}"></div><div><label>Calories</label><input id="lifeCalories" value="${today?.calories||""}"></div><div><label>Drinking water litres</label><input id="lifeWater" value="${today?.water||""}"></div><div><label>Creatine?</label><select id="lifeCreatine"><option>Yes</option><option>No</option></select></div></div><button id="saveLife" style="margin-top:9px">Save today</button></div><div class="card"><h2>Body measurements</h2><div class="grid"><div><label>Waist cm</label><input id="mWaist"></div><div><label>Chest cm</label><input id="mChest"></div><div><label>Arm cm</label><input id="mArm"></div><div><label>Thigh cm</label><input id="mThigh"></div><div><label>Calf cm</label><input id="mCalf"></div></div><button id="saveMeasure" style="margin-top:9px">Save measurements</button></div>`;lifestyle.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>proteinQuickAdd(+b.dataset.add));addCustomProtein.onclick=()=>{const g=+customProtein.value||0;if(g>0)proteinQuickAdd(g)};saveLife.onclick=()=>{const sleep=+lifeSleep.value||0,sq=+lifeSleepQ.value||0,en=+lifeEnergy.value||0,st=+lifeStress.value||0,so=+lifeSore.value||0,score=Math.max(0,Math.min(10,Math.round((sq+en+(11-st)+(11-so))/4)));let entry=state.nutrition.find(x=>x.date===todayKey());if(!entry){entry={date:todayKey(),iso:new Date().toISOString()};state.nutrition.unshift(entry)}Object.assign(entry,{iso:new Date().toISOString(),sleep,protein:+lifeProtein.value||0,calories:+lifeCalories.value||0,water:+lifeWater.value||0,creatine:lifeCreatine.value});state.readiness.unshift({date:todayKey(),iso:new Date().toISOString(),score,sleep,energy:en,stress:st,soreness:so});save();renderAll();alert(`Readiness score: ${score}/10`)};saveMeasure.onclick=()=>{state.measurements.unshift({date:todayKey(),iso:new Date().toISOString(),waist:+mWaist.value||'',chest:+mChest.value||'',arm:+mArm.value||'',thigh:+mThigh.value||'',calf:+mCalf.value||''});save();renderAll()}}
function renderPhotos(){const latest=state.photoHistory?.[0];photos.innerHTML=`<div class="card"><h2>Progress photos</h2><p class="muted">Save a dated front, side and back set. Photos are compressed and stored only on this device.</p>${['front','side','back'].map(x=>`<label>${x[0].toUpperCase()+x.slice(1)} photo</label><input type="file" accept="image/*" data-photo="${x}">`).join('')}<button id="savePhotos" style="margin-top:9px">Save dated photo set</button></div><div class="card"><h2>Latest photos</h2><div class="photoGrid">${['front','side','back'].map(x=>latest?.[x]?`<div><h3>${x}</h3><img src="${latest[x]}" alt="${x} progress photo"><div class="muted">${latest.date}</div></div>`:`<div><h3>${x}</h3><span class="muted">No photo</span></div>`).join('')}</div></div><div class="card"><h2>Photo history</h2>${state.photoHistory?.length?`<table><tr><th>Date</th><th>Views saved</th></tr>${state.photoHistory.slice(0,12).map(s=>`<tr><td>${s.date}</td><td>${['front','side','back'].filter(v=>s[v]).join(', ')}</td></tr>`).join('')}</table>`:'<span class="muted">No dated history yet.</span>'}</div>`;savePhotos.onclick=async()=>{const set={date:todayKey(),iso:new Date().toISOString()};for(const i of photos.querySelectorAll('[data-photo]'))if(i.files[0])set[i.dataset.photo]=await compressImage(i.files[0]);if(!set.front&&!set.side&&!set.back){alert("Choose at least one photo.");return}state.photoHistory.unshift(set);state.photos={};for(const v of ['front','side','back'])if(set[v])state.photos[v]={date:set.date,data:set[v]};try{save();renderAll()}catch(e){alert('Photo storage is full. Export a backup and use smaller photos.')}}}
function compressImage(file){return new Promise((resolve,reject)=>{const img=new Image(),r=new FileReader();r.onload=()=>img.src=r.result;r.onerror=reject;img.onload=()=>{const max=700,scale=Math.min(1,max/img.width),c=document.createElement('canvas');c.width=img.width*scale;c.height=img.height*scale;c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.65))};r.readAsDataURL(file)})}
function renderReports(){const current=state.wellness[0],previous=state.wellness[1];reports.innerHTML=`<div class="card"><h2>Executive coaching scorecard</h2>${(()=>{const s=executiveSummary(30);return`<div class="summaryBanner"><div class="overallRing" style="--score:${(s.overall??0)*3.6}deg"><div>${s.overall===null?"—":s.overall}<small>${s.overall===null?"No score":"/100"}</small></div></div><div><p><b>Biggest win:</b> ${s.biggestWin}</p><p><b>Main priority:</b> ${s.priority}</p><p><b>Body trend:</b> ${s.bodyTrend}</p><p class="muted">Data confidence ${s.confidence}/100</p></div></div><div class="scoreGrid">${scoreTilesHtml(s)}</div>`})()}</div><div class="card"><h2>Monthly coaching report</h2><div class="coach">${monthlyNarrative()}</div></div><div class="card"><h2>Current coaching flags</h2>${coachingFlagsHtml()}</div><div class="card"><h2>Key totals</h2><div class="grid3"><div class="metric"><span class="muted">Strength sessions</span><b>${thisMonth(state.history).length}</b></div><div class="metric"><span class="muted">Myzone sessions</span><b>${thisMonth(state.myzone).length}</b></div><div class="metric"><span class="muted">MEPs</span><b>${sum(thisMonth(state.myzone),"meps")}</b></div></div></div><div class="card"><h2>Body-composition change</h2>${current&&previous?compositionComparison(current,previous):'<span class="muted">Log at least two body-composition assessments to compare changes.</span>'}</div>`}
function coachingFlagsHtml(){const flags=[];if(deloadNeeded())flags.push("A deload week is recommended.");if(recentHardSpin())flags.push("Recent hard spin may affect leg performance.");for(const [name,val] of Object.entries(state.coachFlags||{}))if(val==="pain")flags.push(`${name}: discomfort was reported — do not progress until comfortable.`);for(const n of stalledLifts())flags.push(`${n}: repeat or deload before increasing.`);return flags.length?`<ul>${flags.map(x=>`<li>${x}</li>`).join("")}</ul>`:'<span class="muted">No active coaching warnings.</span>'}
function monthlyNarrative(){const h=thisMonth(state.history),mz=thisMonth(state.myzone),parts=[];parts.push(`You completed ${h.length} strength sessions and ${mz.length} Myzone-tracked sessions this month.`);if(mz.length)parts.push(`Your Myzone total was ${sum(mz,"meps")} MEPs with ${sum(mz,"calories")} recorded calories.`);const lifts=["Bench Press","Back Squat","Standing Overhead Press","Romanian Deadlift"].map(n=>({n,v:state.prs[n]})).filter(x=>x.v);if(lifts.length)parts.push(`Current best working weights include ${lifts.map(x=>`${x.n} ${x.v} kg`).join(", ")}.`);if(state.wellness.length>=2){const c=state.wellness[0],p=state.wellness[1],changes=[];if(c.skeletalMuscleMass&&p.skeletalMuscleMass)changes.push(`skeletal muscle mass changed by ${(c.skeletalMuscleMass-p.skeletalMuscleMass).toFixed(1)} kg`);if(c.bodyFatMass&&p.bodyFatMass)changes.push(`body fat mass changed by ${(c.bodyFatMass-p.bodyFatMass).toFixed(1)} kg`);if(c.phaseAngle&&p.phaseAngle)changes.push(`phase angle changed from ${p.phaseAngle}° to ${c.phaseAngle}°`);if(changes.length)parts.push(`Body-composition update: ${changes.join(", ")}.`)}if(state.nutrition.length){const n=state.nutrition[0];parts.push(`Latest lifestyle entry: ${n.protein||0} g protein, ${n.sleep||0} hours sleep and ${n.water||0} litres water.`)}if(state.measurements.length>=2){const c=state.measurements[0],p=state.measurements[1];if(c.waist&&p.waist)parts.push(`Waist changed by ${(c.waist-p.waist).toFixed(1)} cm since the previous measurement.`)}parts.push(overallAdvice().text);return parts.join(" ")}

function isoDate(x){const d=new Date(x?.iso||x?.date||Date.now());return Number.isNaN(d.getTime())?'Unknown':d.toLocaleDateString()}
function withinDays(arr,days){const cutoff=Date.now()-days*86400000;return (arr||[]).filter(x=>new Date(x.iso||x.date).getTime()>=cutoff)}
function average(arr,key){const vals=(arr||[]).map(x=>+x[key]).filter(Number.isFinite).filter(x=>x!==0);return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0}
function fmtNum(v,d=1){const n=+v;return Number.isFinite(n)&&n!==0?n.toFixed(d).replace(/\.0$/,''):'—'}
function workoutMarkdown(w){if(!w)return 'No strength workout has been logged yet.';const lines=[`### ${w.routine||'Strength workout'} — ${isoDate(w)}`];for(const r of (w.results||[])){const sets=(r.sets||[]).map((s,i)=>`Set ${i+1}: ${s.kg||0} kg × ${s.reps||0}${s.rir!==undefined?` (RIR ${s.rir})`:''}`).join('; ');lines.push(`- **${r.name}:** ${sets}${r.form?`; form ${r.form}`:''}${r.pain&&r.pain!=='no'?`; discomfort ${r.pain}`:''}${r.decision?`; coach decision ${r.decision}`:''}`)}return lines.join('\n')}
function liftSummaryMarkdown(){const names=['Bench Press','Back Squat','Standing Overhead Press','Romanian Deadlift','Assisted Pull-ups'];return names.map(name=>{const e=Object.values(DATA.routines).flat().find(x=>x.name===name);return `| ${name} | ${state.prs?.[name]??e?.start??'—'} | ${state.next?.[name]??'—'} | ${e?.goal??'—'} |`}).join('\n')}
function myzoneSummaryMarkdown(days){const rows=withinDays(state.myzone,days),spins=rows.filter(x=>String(x.type).toLowerCase()==='spin');return `- Sessions: ${rows.length}\n- Spin sessions: ${spins.length}\n- Total MEPs: ${sum(rows,'meps')}\n- Recorded calories: ${sum(rows,'calories')}\n- Average heart rate: ${fmtNum(average(rows,'avgHr'),0)} bpm\n- Average effort: ${fmtNum(average(rows,'effort'),0)}%\n- High-zone minutes: ${sum(rows,'highZone')}`}
function wellnessMarkdown(){const w=state.wellness?.[0];if(!w)return 'No Wellness Passport assessment has been logged.';return `- Assessment date: ${isoDate(w)}\n- Weight: ${fmtNum(w.weight)} kg\n- BMI: ${fmtNum(w.bmi)}\n- Skeletal muscle mass: ${fmtNum(w.skeletalMuscleMass)} kg\n- Soft lean mass: ${fmtNum(w.softLeanMass)} kg\n- Fat-free mass: ${fmtNum(w.fatFreeMass)} kg\n- Body fat mass: ${fmtNum(w.bodyFatMass)} kg\n- Body fat: ${fmtNum(w.bodyFat)}%\n- Bone mineral content: ${fmtNum(w.boneMineralContent)} kg\n- Total body water: ${fmtNum(w.totalBodyWater)} kg\n- Intracellular water: ${fmtNum(w.intracellularWater)} kg\n- Extracellular water: ${fmtNum(w.extracellularWater)} kg\n- Phase angle: ${fmtNum(w.phaseAngle)}°\n- BMR: ${fmtNum(w.bmr,0)} kcal\n- Wellness age: ${fmtNum(w.wellnessAge,0)}\n- Strength / cardio / balance / mobility: ${fmtNum(w.strength,0)} / ${fmtNum(w.cardio,0)} / ${fmtNum(w.balance,0)} / ${fmtNum(w.mobility,0)}`}
function proteinSummaryMarkdown(days){const rows=withinDays(state.nutrition,days),goal=+state.profile.proteinGoal||160,values=rows.map(x=>+x.protein||0),hit=values.filter(x=>x>=goal).length;return `- Protein target: ${goal} g/day\n- Average protein: ${fmtNum(average(rows,'protein'),0)} g/day\n- Target achieved: ${hit}/${days} days\n- Highest recorded day: ${values.length?Math.max(...values):'—'} g\n- Average difference from target: ${values.length?Math.round(average(rows,'protein')-goal):'—'} g/day`}
function photoExportMarkdown(){const current=state.photoHistory?.[0],previous=state.photoHistory?.[1];if(!current)return"No progress photos stored.";return `- Current photo set: ${current.date} (${['front','side','back'].filter(v=>current[v]).join(', ')})\n- Previous comparison: ${previous?previous.date+' ('+['front','side','back'].filter(v=>previous[v]).join(', ')+')':'none yet'}\n- Images remain stored in the app and must be uploaded separately to ChatGPT.`}
function lifestyleMarkdown(days){const n=withinDays(state.nutrition,days),r=withinDays(state.readiness,days),m=withinDays(state.measurements,days),x=m[0];return `- Average sleep: ${fmtNum(average(n,'sleep'))} hours\n- Average protein: ${fmtNum(average(n,'protein'),0)} g/day (goal ${state.profile.proteinGoal||'—'} g)\n- Average calories: ${fmtNum(average(n,'calories'),0)} kcal/day (goal ${state.profile.calorieGoal||'—'})\n- Average water: ${fmtNum(average(n,'water'))} L/day (goal ${state.profile.waterGoal||'—'} L)\n- Average readiness: ${fmtNum(average(r,'score'))}/10\n- Latest measurements: waist ${fmtNum(x?.waist)} cm; chest ${fmtNum(x?.chest)} cm; arm ${fmtNum(x?.arm)} cm; thigh ${fmtNum(x?.thigh)} cm; calf ${fmtNum(x?.calf)} cm`}
function periodWorkouts(days){const rows=withinDays(state.history,days);return rows.length?rows.map(workoutMarkdown).join('\n\n'):'No strength workouts were logged in this period.'}
function coachingRequest(kind,q){const asks={daily:'Review my readiness and latest training. Tell me exactly what workout and working weights I should use today, which exercises should increase, repeat or reduce, and why.',weekly:'Review the last 7 days. Assess strength progression, recovery, spin fatigue, nutrition and consistency. Recommend specific changes for next week.',monthly:'Review the last 30 days. Assess strength, Myzone workload, recovery, nutrition and body composition. Give priorities and precise recommendations for the next month.',programme:'Review the last 56 days and my current programme. Decide whether exercise selection, weekly volume or progression should change. Produce an updated 8-week plan only where changes are justified.',custom:q||'Review my data and answer my coaching question.'};return asks[kind]||asks.custom}
function generateChatGPTReport(kind,q){const days=kind==='daily'?3:kind==='weekly'?7:kind==='programme'?56:30;return [
`# David's Strength Coach — ChatGPT Export`,
`Generated: ${new Date().toLocaleString()}`,
`${executiveMarkdown(days)}`,
`## Profile and goals\n- Height: ${state.profile.heightCm||193} cm (approximately 6 ft 4 in)\n- Current body weight: ${state.profile.weight||88} kg\n- Goals: become stronger, build muscle, develop a strong core and achieve visible abdominal definition\n- Training: three strength sessions and approximately three spin sessions per week\n- Equipment: Village Gym racks, barbells, dumbbells, machines and assisted pull-up machine`,
`## Current coaching status\n- Readiness: ${readinessScore()}/10\n- App recommendation: ${overallAdvice().title} — ${overallAdvice().text}\n- Repeated stalls: ${stalledLifts().length?stalledLifts().join(', '):'none currently flagged'}\n- Recent hard spin: ${recentHardSpin()?'yes':'no'}`,
`## Current lifts and targets\n| Exercise | Current best/assistance kg | Next suggested kg | Goal kg/reps |\n|---|---:|---:|---:|\n${liftSummaryMarkdown()}`,
`## Most recent workout\n${workoutMarkdown(state.history?.[0])}`,
`## Strength workouts in the last ${days} days\n${periodWorkouts(days)}`,
`## Myzone summary — last ${days} days\n${myzoneSummaryMarkdown(days)}`,
`## Latest Wellness Passport and body composition\n${wellnessMarkdown()}`,
`## Recovery, nutrition and measurements — last ${days} days\n${lifestyleMarkdown(days)}\n\n### Protein target performance\n${proteinSummaryMarkdown(days)}`,
`## Progress photos\n${photoExportMarkdown()}`,
`## Current programme\n${Object.entries(DATA.routines).map(([day,ex])=>`### ${day}\n${ex.map(x=>`- ${x.name}: ${x.sets} × ${x.reps}; current suggestion ${state.next?.[x.name]??x.start} kg; goal ${x.goal} kg`).join('\n')}`).join('\n\n')}`,
`## Coaching request\nAct as an experienced evidence-based strength and conditioning coach. Use the supplied information, explain your reasoning clearly, prioritise safe progressive overload, and account for three weekly spin sessions. Do not diagnose medical conditions.\n\n${coachingRequest(kind,q)}${q&&kind!=='custom'?`\n\nAdditional question: ${q}`:''}`,
`## Response format requested\n1. Overall assessment\n2. What is progressing well\n3. Main limitations or risks\n4. Exercise-by-exercise weight recommendations\n5. Recovery and spin adjustments\n6. Nutrition or body-composition observations\n7. Exact plan until the next review\n8. Confirm or challenge the app's automatic scores, explaining any disagreement`
].join('\n\n')}
async function copyReportText(text){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return true}}catch(e){}const box=document.getElementById('chatgptReportText');box.focus();box.select();box.setSelectionRange(0,box.value.length);try{return document.execCommand('copy')}catch(e){return false}}
function renderChatGPTExport(){chatgptExport.innerHTML=`<div class="card"><h2>Export for ChatGPT</h2><p class="muted">Generate a structured report, then copy it into ChatGPT. Progress photos are not included; upload those separately in the same conversation.</p><div class="grid"><div><label>Report type</label><select id="chatgptReportType"><option value="daily">Daily coaching</option><option value="weekly" selected>Weekly review</option><option value="monthly">Monthly review</option><option value="programme">8-week programme review</option><option value="custom">Custom question</option></select></div><div><label>Detail</label><select id="chatgptDetail"><option value="full" selected>Full report</option><option value="compact">Compact summary</option></select></div></div><label>Optional question</label><textarea id="chatgptQuestion" placeholder="Example: Should I increase my bench tomorrow and reduce leg volume after spin?"></textarea><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button id="generateChatgptReport">Generate report</button><button id="copyChatgptReport" class="good">Copy for ChatGPT</button><button id="downloadChatgptReport" class="secondary">Download .md</button></div><div id="chatgptCopyStatus" class="copyStatus muted" aria-live="polite"></div></div><div class="card"><h2>Generated report</h2><textarea id="chatgptReportText" class="reportBox" spellcheck="false"></textarea></div>`;
function refresh(){let text=generateChatGPTReport(chatgptReportType.value,chatgptQuestion.value.trim());if(chatgptDetail.value==='compact')text=text.split('\n').filter(line=>!line.startsWith('- **')).join('\n');chatgptReportText.value=text;chatgptCopyStatus.textContent=`Report ready: ${text.length.toLocaleString()} characters.`}
generateChatgptReport.addEventListener('click',refresh);chatgptReportType.addEventListener('change',refresh);chatgptDetail.addEventListener('change',refresh);copyChatgptReport.addEventListener('click',async()=>{if(!chatgptReportText.value)refresh();const ok=await copyReportText(chatgptReportText.value);chatgptCopyStatus.textContent=ok?'Copied. Open ChatGPT and paste it into a new message.':'Copy was blocked. Press and hold inside the report, then choose Select All and Copy.'});downloadChatgptReport.addEventListener('click',()=>{if(!chatgptReportText.value)refresh();download(`davids-chatgpt-coaching-${chatgptReportType.value}.md`,chatgptReportText.value,'text/markdown;charset=utf-8')});refresh()}


function appDiagnostics(){let reportOkay=false,downloadOkay=false;try{reportOkay=generateChatGPTReport("weekly","diagnostic").includes("ChatGPT Export")}catch(e){}try{downloadOkay=typeof download==="function"&&typeof Blob==="function"&&typeof URL.createObjectURL==="function"}catch(e){}return[['11 navigation tabs',document.querySelectorAll('nav button').length===11],['Coach Dashboard',typeof dashboardInsights==='function'&&!!document.getElementById('home')],['Workout draft memory',typeof captureWorkoutDraft==='function'&&state.inProgress!==undefined],['Guides and diagrams',typeof displayGuide==='function'&&typeof diagramSvg==='function'],['Video library',typeof GUIDE_META==='object'&&Object.keys(GUIDE_META).length>=10],['Adaptive coaching',typeof overallAdvice==='function'&&typeof deloadNeeded==='function'],['Progress charts',typeof drawCharts==='function'],['Myzone logging',typeof renderMyzone==='function'],['Wellness water units kg',document.documentElement.innerHTML.includes('Total body water (kg)')],['Protein target tracker',typeof proteinQuickAdd==='function'&&state.profile.proteinGoal>0],['Dated photo history',Array.isArray(state.photoHistory)],['Executive score engine',typeof executiveSummary==='function'&&typeof coachingScores==='function'],['ChatGPT report generation',reportOkay],['Markdown/backup download',downloadOkay],['Backup and restore',typeof save==='function'&&typeof localStorage!=='undefined'],['Offline service-worker support','serviceWorker'in navigator]]}
function renderDiagnostics(){
 const box=document.getElementById('diagnosticsResult');
 if(!box)return;
 const tests=appDiagnostics(),passed=tests.filter(x=>x[1]).length;
 box.innerHTML=`<h3>${passed}/${tests.length} checks passed</h3>${tests.map(x=>`<div class="diagRow"><span>${x[0]}</span><b class="${x[1]?'diagPass':'diagFail'}">${x[1]?'PASS':'CHECK'}</b></div>`).join('')}<p class="muted">A service-worker check may show CHECK when testing before the app is installed or while browsing privately.</p>`;
}

function renderSettings(){settings.innerHTML=`<div class="card"><h2>Profile and targets</h2><div class="grid"><div><label>Body weight kg</label><input id="bodyWeight" value="${state.profile.weight}"></div><div><label>Protein target g/day</label><input id="proteinGoal" value="${state.profile.proteinGoal||160}"></div><div><label>Calories target</label><input id="calorieGoal" value="${state.profile.calorieGoal||2400}"></div><div><label>Drinking water target L/day</label><input id="waterGoal" value="${state.profile.waterGoal||3}"></div><div><label>Weekly strength goal</label><input id="strengthGoal" value="${state.weeklyGoals.strength||3}"></div><div><label>Weekly spin goal</label><input id="spinGoal" value="${state.weeklyGoals.spin||3}"></div><div><label>Protein target days/week</label><input id="proteinDaysGoal" value="${state.weeklyGoals.proteinDays||7}"></div><div><label>Readiness today 1–10</label><input id="readyToday" value="${readinessScore()}"></div></div><label>Theme</label><select id="theme"><option value="light">Light</option><option value="dark" ${state.profile.theme==="dark"?"selected":""}>Dark</option></select><button id="saveSettings" style="margin-top:9px">Save targets</button></div><div class="card"><h2>App diagnostics</h2><p class="muted">Runs live checks on the current build.</p><button id="runDiagnostics" class="secondary">Run diagnostics</button><div id="diagnosticsResult"></div></div><div class="card"><h2>Backup</h2><button id="exportBtn" class="secondary">Export backup</button><label>Import backup</label><input type="file" id="importFile" accept=".json"><button id="resetBtn" class="bad" style="margin-top:9px">Reset all data</button></div>`;saveSettings.onclick=()=>{state.profile.weight=+bodyWeight.value||88;state.profile.proteinGoal=+proteinGoal.value||160;state.profile.calorieGoal=+calorieGoal.value||2400;state.profile.waterGoal=+waterGoal.value||3;state.profile.theme=theme.value;state.weeklyGoals={strength:+strengthGoal.value||3,spin:+spinGoal.value||3,proteinDays:+proteinDaysGoal.value||7};state.readiness.unshift({date:todayKey(),iso:new Date().toISOString(),score:+readyToday.value||7});save();applyTheme();renderAll()};runDiagnostics.onclick=renderDiagnostics;exportBtn.onclick=()=>download("davids-strength-coach-backup.json",JSON.stringify(state,null,2),"application/json");importFile.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);for(const k of Object.keys(defaults))if(state[k]===undefined)state[k]=defaults[k];save();applyTheme();renderAll();alert("Backup imported.")}catch{alert("Invalid backup file.")}};r.readAsText(f)};resetBtn.onclick=()=>{if(confirm("Delete all saved data?")){localStorage.clear();location.reload()}}}
function download(name,text,type="text/plain;charset=utf-8"){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);return true}
function downloadText(name,text){return download(name,text,"text/plain;charset=utf-8")}
function applyTheme(){document.documentElement.dataset.theme=state.profile.theme||"light"}
function renderAll(){renderHome();renderTrain();renderGuides();renderProgress();renderMyzone();renderWellness();renderLifestyle();renderPhotos();renderReports();renderChatGPTExport();renderSettings()}
applyTheme();initNav();renderAll();if("serviceWorker"in navigator)navigator.serviceWorker.register("service-worker.js");
</script></body></html>
