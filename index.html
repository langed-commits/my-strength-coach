<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>My Strength Coach</title><style>:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--blue:#2563eb;--green:#16a34a;--red:#dc2626;--border:#d1d5db}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}header{background:#111827;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10}header h1{font-size:20px;margin:0}nav{display:flex;overflow:auto;gap:7px;padding:9px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:51px;z-index:9}nav button{border:0;border-radius:999px;padding:9px 12px;white-space:nowrap}.activeTab{background:var(--blue);color:#fff}main{padding:12px;max-width:920px;margin:auto}.page{display:none}.page.active{display:block}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 7px #0000000a}h2,h3{margin-top:0}.muted{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}button,.button{border:0;border-radius:10px;padding:11px 13px;background:var(--blue);color:#fff;font-weight:650;font-size:15px;text-decoration:none;display:inline-block}.secondary{background:#4b5563}.green{background:var(--green)}.red{background:var(--red)}input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--border);border-radius:10px;background:#fff}label{display:block;font-size:12px;color:var(--muted);margin:7px 0 4px}.exercise{padding:14px 0;border-top:1px solid var(--border)}.chip{display:inline-block;font-size:12px;padding:5px 8px;border-radius:999px;background:#eff6ff;color:#1d4ed8;margin:4px 3px 3px 0}.setrow{display:grid;grid-template-columns:35px 1fr 1fr 48px;gap:6px;align-items:end;margin-top:7px}.setrow input{text-align:center}.done{background:#dcfce7!important}.timer{font-size:38px;text-align:center;font-variant-numeric:tabular-nums;margin:12px}.diagram svg{width:100%;height:auto;margin-top:10px}.notice{padding:10px;border-radius:10px;background:#fff7ed;color:#9a3412;margin:8px 0}.stat{font-size:26px;font-weight:750}@media(min-width:720px){.three{grid-template-columns:repeat(3,1fr)}}</style></head><body><header><h1>My Strength Coach</h1></header><nav id="nav"></nav><main><section id="home" class="page active"></section><section id="train" class="page"></section><section id="history" class="page"></section><section id="guides" class="page"></section><section id="timer" class="page"></section><section id="settings" class="page"></section></main><script>const DATA={"routines": {"Upper A": [["Bench Press", 5, 5, 40, "70\u201380 kg \u00d7 5"], ["Assisted Pull-ups", 5, 5, 25, "10 bodyweight reps"], ["Standing Overhead Press", 4, 5, 25, "50 kg \u00d7 5"], ["Barbell Row", 4, 6, 40, "70 kg \u00d7 8"], ["Incline Dumbbell Press", 3, 8, 15, "25\u201330 kg each"], ["Face Pull", 3, 15, 20, "35+ kg"], ["Farmer's Carry", 3, "40 m", 30, "45 kg each"], ["Hanging Knee Raise", 3, 12, 0, "Straight-leg raises"], ["Front Plank", 3, "60 sec", 0, "120 sec"]], "Legs & Core": [["Back Squat", 5, 5, 50, "100\u2013120 kg \u00d7 5"], ["Romanian Deadlift", 4, 8, 50, "90\u2013110 kg \u00d7 8"], ["Bulgarian Split Squat", 3, "8/leg", 10, "20 kg each"], ["Leg Press", 3, 10, 120, "200+ kg"], ["Hamstring Curl", 3, 12, 30, "50+ kg"], ["Calf Raise", 4, 15, 0, "Heavy"], ["Ab Wheel", 3, 10, 0, "15 controlled reps"], ["Cable Crunch", 3, 15, 30, "50 kg"]], "Upper B": [["Incline Barbell Bench", 4, 6, 35, "65 kg \u00d7 6"], ["Assisted Pull-ups", 4, 8, 25, "10 bodyweight reps"], ["Seated Dumbbell Press", 3, 8, 12.5, "22.5 kg each"], ["Chest-Supported Row", 4, 8, 40, "70 kg"], ["Cable Fly", 3, 12, 10, "20 kg/side"], ["Lat Pulldown", 3, 10, 45, "70 kg"], ["Dumbbell Lateral Raise", 3, 15, 6, "12 kg each"], ["Barbell Curl", 3, 10, 20, "35 kg"], ["Triceps Pushdown", 3, 10, 25, "45 kg"]]}, "videos": {"Bench Press": "https://www.youtube.com/watch?v=A0NBCkpYatQ", "Back Squat": "https://www.youtube.com/watch?v=-OQvt9c3Kvk", "Romanian Deadlift": "https://www.youtube.com/watch?v=_oyxCn2iSjU", "Standing Overhead Press": "https://www.youtube.com/watch?v=GGpArq725ls", "Seated Dumbbell Press": "https://www.youtube.com/watch?v=HzIiNhHhhtA"}, "instructions": {"Bench Press": ["Set your eyes beneath the bar and plant both feet.", "Pull the shoulder blades down and together.", "Lower the bar toward the lower chest with wrists stacked above elbows.", "Press upward without bouncing the bar.", "Use safety arms or a spotter for challenging sets."], "Back Squat": ["Set the hooks just below shoulder height.", "Brace before every repetition.", "Sit down and slightly back while keeping the whole foot planted.", "Keep the knees tracking in line with the toes.", "Drive upward without allowing the knees to collapse inward."], "Romanian Deadlift": ["Keep soft knees and the bar close to your legs.", "Push the hips backwards rather than squatting down.", "Stop when the hamstrings are strongly stretched or your back position changes.", "Drive the hips forward to stand.", "Do not lean backwards at the top."], "Standing Overhead Press": ["Brace the abdomen and squeeze the glutes.", "Start with the forearms close to vertical.", "Press upward while moving your head slightly back.", "Finish with the bar balanced above the mid-foot.", "Avoid excessive lower-back arching."], "Assisted Pull-ups": ["Choose enough assistance for full-range repetitions.", "Begin from a controlled hang.", "Pull the elbows down toward your sides.", "Avoid swinging or kicking.", "Lower slowly and under control."], "Barbell Row": ["Hinge at the hips and brace with a neutral spine.", "Pull the bar toward the lower ribs.", "Keep your torso angle stable.", "Lower the bar under control.", "Reduce the weight if momentum takes over."]}, "svg": "<svg viewBox=\"0 0 420 150\" aria-label=\"Simplified exercise movement diagram\"><rect width=\"420\" height=\"150\" rx=\"14\" fill=\"#f8fafc\"/><text x=\"105\" y=\"22\" text-anchor=\"middle\" font-size=\"14\">START</text><text x=\"315\" y=\"22\" text-anchor=\"middle\" font-size=\"14\">FINISH</text><circle cx=\"105\" cy=\"52\" r=\"12\" fill=\"none\" stroke=\"#111827\" stroke-width=\"4\"/><line x1=\"105\" y1=\"64\" x2=\"105\" y2=\"106\" stroke=\"#111827\" stroke-width=\"4\"/><line x1=\"105\" y1=\"76\" x2=\"75\" y2=\"88\" stroke=\"#111827\" stroke-width=\"4\"/><line x1=\"105\" y1=\"76\" x2=\"135\" y2=\"88\" stroke=\"#111827\" stroke-width=\"4\"/><line x1=\"105\" y1=\"106\" x2=\"88\" y2=\"138\" stroke=\"#111827\" stroke-width=\"4\"/><line x1=\"105\" y1=\"106\" x2=\"122\" y2=\"138\" stroke=\"#111827\" stroke-width=\"4\"/><circle cx=\"315\" cy=\"52\" r=\"12\" fill=\"none\" stroke=\"#111827\" stroke-width=\"4\"/><line x1=\"315\" y1=\"64\" x2=\"315\" y2=\"106\" stroke=\"#111827\" stroke-width=\"4\"/><line x1=\"315\" y1=\"76\" x2=\"290\" y2=\"42\" stroke=\"#111827\" stroke-width=\"4\"/><line x1=\"315\" y1=\"76\" x2=\"340\" y2=\"42\" stroke=\"#111827\" stroke-width=\"4\"/><line x1=\"315\" y1=\"106\" x2=\"298\" y2=\"138\" stroke=\"#111827\" stroke-width=\"4\"/><line x1=\"315\" y1=\"106\" x2=\"332\" y2=\"138\" stroke=\"#111827\" stroke-width=\"4\"/><line x1=\"285\" y1=\"36\" x2=\"345\" y2=\"36\" stroke=\"#2563eb\" stroke-width=\"7\"/></svg>"};let state=JSON.parse(localStorage.getItem('msc-state')||'{"history":[],"profile":{"weight":88,"spin":3},"prs":{},"next":{}}');const save=()=>localStorage.setItem('msc-state',JSON.stringify(state));const tabs=[['home','Home'],['train','Train'],['history','History'],['guides','Guides'],['timer','Timer'],['settings','Settings']];function initNav(){nav.innerHTML=tabs.map((t,i)=>`<button class="${i?'':'activeTab'}" data-id="${t[0]}">${t[1]}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>openPage(b.dataset.id,b))}function openPage(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');nav.querySelectorAll('button').forEach(x=>x.classList.remove('activeTab'));b.classList.add('activeTab');render()}function renderHome(){let last=state.history[0];home.innerHTML=`<div class="card"><h2>Dashboard</h2><div class="grid three"><div><div class="muted">Body weight</div><div class="stat">${state.profile.weight} kg</div></div><div><div class="muted">Workouts</div><div class="stat">${state.history.length}</div></div><div><div class="muted">Spin/week</div><div class="stat">${state.profile.spin}</div></div></div></div><div class="card"><h3>Latest workout</h3>${last?`<b>${last.routine}</b><div class="muted">${last.date}</div>`:'<span class="muted">No workouts logged yet.</span>'}</div><div class="card"><h3>Personal records</h3>${Object.keys(state.prs).length?Object.entries(state.prs).map(([k,v])=>`<div>${k}: <b>${v} kg</b></div>`).join(''):'<span class="muted">PRs update automatically.</span>'}</div>`}function renderTrain(){train.innerHTML=`<div class="card"><h2>Choose workout</h2><select id="routine">${Object.keys(DATA.routines).map(x=>`<option>${x}</option>`).join('')}</select><button onclick="startWorkout(routine.value)" style="margin-top:9px">Load workout</button></div><div id="session"></div>`}function startWorkout(name){session.innerHTML=`<div class="card"><h2>${name}</h2><div class="notice">Use weights that leave roughly 1–2 controlled repetitions in reserve.</div>${DATA.routines[name].map((e,i)=>exerciseForm(e,i)).join('')}<label>Session notes</label><textarea id="sessionNotes"></textarea><button class="green" onclick="finishWorkout('${name}')">Save workout</button></div>`}function exerciseForm(e,i){let prior=state.next[e[0]]??e[3];return `<div class="exercise"><h3>${e[0]}</h3><span class="chip">${e[1]} sets</span><span class="chip">${e[2]} reps</span><span class="chip">Start ${prior} kg</span><span class="chip">Goal ${e[4]}</span>${Array.from({length:+e[1]},(_,s)=>`<div class="setrow"><b>${s+1}</b><div><label>kg</label><input inputmode="decimal" id="kg-${i}-${s}" value="${prior||''}"></div><div><label>reps</label><input inputmode="numeric" id="rp-${i}-${s}" value="${typeof e[2]=='number'?e[2]:''}"></div><button class="secondary" onclick="this.classList.toggle('done')">✓</button></div>`).join('')}<label>Notes</label><input id="note-${i}" placeholder="Form, assistance, difficulty..."><button class="secondary" style="margin-top:8px" onclick="showGuide(${JSON.stringify(e[0])})">Guide and video</button></div>`}function finishWorkout(name){let exs=DATA.routines[name].map((e,i)=>{let sets=[];for(let s=0;s<+e[1];s++)sets.push({kg:+document.getElementById(`kg-${i}-${s}`).value||0,reps:+document.getElementById(`rp-${i}-${s}`).value||0});let best=Math.max(...sets.map(x=>x.kg));if(best>(state.prs[e[0]]||0))state.prs[e[0]]=best;let target=typeof e[2]=='number'?e[2]:0,all=sets.every(x=>x.reps>=target),inc=['Bench Press','Standing Overhead Press','Barbell Row','Incline Barbell Bench'].includes(e[0])?2.5:['Back Squat','Romanian Deadlift'].includes(e[0])?5:0;state.next[e[0]]=all?best+inc:best;return{name:e[0],sets,notes:document.getElementById(`note-${i}`).value,next:state.next[e[0]]}});state.history.unshift({date:new Date().toLocaleString(),routine:name,exercises:exs,notes:sessionNotes.value});save();alert('Workout saved.');render()}function renderHistory(){history.innerHTML=`<div class="card"><h2>Workout history</h2>${state.history.length?state.history.map((w,i)=>`<details><summary>${w.date} — ${w.routine}</summary>${w.exercises.map(e=>`<div class="exercise"><b>${e.name}</b><div>${e.sets.map((s,j)=>`Set ${j+1}: ${s.kg} kg × ${s.reps}`).join('<br>')}</div><div class="muted">Next suggestion: ${e.next} kg</div></div>`).join('')}<button class="red" onclick="if(confirm('Delete workout?')){state.history.splice(${i},1);save();render()}">Delete</button></details>`).join('<hr>'):'<span class="muted">No sessions saved.</span>'}</div>`}function renderGuides(){let names=[...new Set(Object.values(DATA.routines).flat().map(x=>x[0]))];guides.innerHTML=`<div class="card"><h2>Exercise guide</h2><select id="guideSelect">${names.map(x=>`<option>${x}</option>`).join('')}</select><button onclick="displayGuide(guideSelect.value)" style="margin-top:9px">Open guide</button></div><div id="guideCard"></div>`}function showGuide(name){openPage('guides',nav.querySelector('[data-id=guides]'));setTimeout(()=>{guideSelect.value=name;displayGuide(name)},0)}function displayGuide(name){let item=Object.values(DATA.routines).flat().find(x=>x[0]===name),steps=DATA.instructions[name]||['Move through a comfortable, controlled range.','Brace your trunk and keep joints aligned.','Avoid using momentum.','Stop if you feel sharp pain.','Ask a qualified coach to check unfamiliar movements.'],video=DATA.videos[name]||`https://www.youtube.com/results?search_query=${encodeURIComponent(name+' proper form tutorial')}`;guideCard.innerHTML=`<div class="card"><h2>${name}</h2><span class="chip">Starting guide ${item[3]} kg</span><span class="chip">12-month goal ${item[4]}</span><div class="diagram">${DATA.svg}</div><h3>How to perform it</h3>${steps.map((x,i)=>`<p><b>${i+1}.</b> ${x}</p>`).join('')}<a class="button" target="_blank" rel="noopener" href="${video}">Watch technique video</a><p class="muted">Videos need internet access. Written instructions remain available offline.</p></div>`}let timerId=null,remaining=90;function renderTimer(){timer.innerHTML=`<div class="card"><h2>Rest timer</h2><select id="seconds"><option value="60">60 seconds</option><option selected value="90">90 seconds</option><option value="120">2 minutes</option><option value="180">3 minutes</option><option value="240">4 minutes</option></select><div id="clock" class="timer">01:30</div><button onclick="startTimer()">Start</button> <button class="secondary" onclick="clearInterval(timerId)">Pause</button> <button class="red" onclick="clearInterval(timerId);remaining=+seconds.value;showClock()">Reset</button></div>`}function showClock(){clock.textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0')}function startTimer(){clearInterval(timerId);if(remaining<=0)remaining=+seconds.value;timerId=setInterval(()=>{remaining--;showClock();if(remaining<=0){clearInterval(timerId);navigator.vibrate?.([200,100,200]);alert('Rest complete.')}},1000)}function renderSettings(){settings.innerHTML=`<div class="card"><h2>Settings</h2><div class="grid"><div><label>Body weight (kg)</label><input id="bw" value="${state.profile.weight}"></div><div><label>Spin sessions/week</label><input id="sp" value="${state.profile.spin}"></div></div><button onclick="state.profile={weight:+bw.value||88,spin:+sp.value||3};save();render()" style="margin-top:9px">Save</button></div><div class="card"><h3>Backup</h3><button class="secondary" onclick="exportData()">Export data</button> <button class="red" onclick="if(confirm('Delete everything?')){localStorage.clear();location.reload()}">Reset app</button><p class="muted">Workout data is stored on this device. Export a backup periodically.</p></div>`}function exportData(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='strength-coach-backup.json';a.click()}function render(){renderHome();renderTrain();renderHistory();renderGuides();renderTimer();renderSettings()}initNav();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');</script></body></html>
